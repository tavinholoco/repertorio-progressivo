name: CI — Testes, Tipos e Lint

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Verificar tipos, lint e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Rodar testes
        run: npm test -- --ci --forceExit
